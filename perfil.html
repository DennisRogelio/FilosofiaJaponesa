<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil del autor — Entre Japón y México</title>
  <meta
    name="description"
    content="Perfil del autor de la aplicación educativa Entre Japón y México."
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <!-- Barra superior -->
    <header class="top-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        Entre Japón y México
      </div>
      <nav aria-label="Navegación principal">
        <a class="nav-link" href="index.html">← Volver al juego</a>
      </nav>
    </header>

    <main class="profile-layout">
      <!-- Sidebar con los datos del autor -->
      <aside class="profile-sidebar">
        <!-- TODO: reemplazar img/perfil.jpg por la fotografía real del autor -->
        <img
          class="profile-photo"
          src="img/perfil.jpeg"
          alt="Fotografía de perfil del autor"
        />
        <h1>Dennis Rogelio Rodriguez Medina</h1>
        <ul class="profile-facts">
          <li>
            <span class="profile-fact-label">Correo</span>
            <span class="profile-fact-value">drrm77485@gmail.com</span>
          </li>
          <li>
            <span class="profile-fact-label">Edad</span>
            <span class="profile-fact-value">25 años</span>
          </li>
          <li>
            <span class="profile-fact-label">Carrera</span>
            <span class="profile-fact-value">Ingenieria de Software</span>
          </li>
        </ul>
        <a class="btn back-to-game" href="index.html">← Volver al juego</a>
      </aside>

      <!-- Galería -->
      <section class="profile-gallery-panel" aria-labelledby="galeria-title">
        <div class="section-title">
          <h2 id="galeria-title">Galería</h2>
          <span class="divider-line" aria-hidden="true"></span>
        </div>
        <div class="gallery-grid-fit">
          <!-- TODO: reemplazar foto1.jpg – foto6.jpg por fotografías reales -->
          <figure class="gallery-item">
            <img src="img/foto1.jpeg" alt="Fotografía relacionada con programación y desarrollo" />
            <figcaption class="gallery-caption">Mi persona</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="img/foto2.jpg" alt="Fotografía de un proyecto personal" />
            <figcaption class="gallery-caption">Afan por los VideoJuegos</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="img/foto3.jpg" alt="Fotografía de momentos con amigos" />
            <figcaption class="gallery-caption">Gusto por la comida tradicional</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="img/foto4.jpeg" alt="Fotografía de intereses personales" />
            <figcaption class="gallery-caption">Famila, motivacion</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="img/foto5.jpg" alt="Fotografía adicional del autor" />
            <figcaption class="gallery-caption">Gusto por la programacion</figcaption>
          </figure>
          <figure class="gallery-item">
            <img src="img/foto6.jpeg" alt="Fotografía adicional del autor" />
            <figcaption class="gallery-caption">Amistades</figcaption>
          </figure>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
